[project]
name = "leakfix"
version = "0.1.0"
description = "Physically modelled light-leak removal for film scans"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8", "scipy>=1.10", "gradio>=4.0"]

[project.optional-dependencies]
propose = ["anthropic"]
inpaint = ["torch>=2.0"]
detect = ["ultralytics>=8.3"]

[project.scripts]
leakfix = "leakfix.app:main"
leakfix-cli = "leakfix.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["leakfix"]
